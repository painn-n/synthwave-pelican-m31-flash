<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Delivery — Synthwave Boardwalk</title>
<style>
  :root { color-scheme: dark; }

  * { box-sizing: border-box; }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #26103f;
  }

  body {
    display: grid;
    place-items: center;
  }

  #art {
    display: block;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .outline {
    stroke: #2b2338;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fine-outline {
    stroke: #2b2338;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .rim {
    fill: none;
    stroke: #ffb36b;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .85;
  }

  .soft-rim {
    fill: none;
    stroke: #ffd19b;
    stroke-width: 2.5;
    stroke-linecap: round;
    opacity: .75;
  }

  .twinkle {
    transform-box: fill-box;
    transform-origin: center;
    animation: starTwinkle 3.4s ease-in-out infinite;
  }

  .cloud-drift {
    transform-box: fill-box;
    animation: cloudDrift 25s ease-in-out infinite alternate;
  }

  .cloud-drift.slow {
    animation-duration: 38s;
    animation-direction: alternate-reverse;
  }

  .sea-shimmer {
    animation: seaShimmer 4.8s ease-in-out infinite;
  }

  .sea-shimmer.delay {
    animation-delay: -2.2s;
  }

  .sun-rays {
    animation: raysPulse 5.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  .beacon-glow {
    animation: beaconGlow 3s ease-in-out infinite;
  }

  .controller-cable {
    animation: cableSway 4.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: right center;
  }

  #grain-overlay {
    pointer-events: none;
    mix-blend-mode: soft-light;
    opacity: .22;
  }

  @keyframes starTwinkle {
    0%, 100% { opacity: .28; transform: scale(.72); }
    50%      { opacity: 1;   transform: scale(1.22); }
  }

  @keyframes cloudDrift {
    from { transform: translate(-18px, 2px); }
    to   { transform: translate(38px, -7px); }
  }

  @keyframes seaShimmer {
    0%, 100% { opacity: .22; transform: translateX(-8px); }
    50%      { opacity: .72; transform: translateX(12px); }
  }

  @keyframes raysPulse {
    0%, 100% { opacity: .24; }
    50%      { opacity: .64; }
  }

  @keyframes beaconGlow {
    0%, 100% { opacity: .5; }
    50%      { opacity: 1; }
  }

  @keyframes cableSway {
    0%, 100% { transform: rotate(-.7deg) translateY(0); }
    50%      { transform: rotate(.8deg) translateY(2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .twinkle,
    .cloud-drift,
    .sea-shimmer,
    .sun-rays,
    .beacon-glow,
    .controller-cable {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<svg id="art"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 1200"
     preserveAspectRatio="xMidYMid slice"
     role="img"
     aria-labelledby="art-title art-description">

  <title id="art-title">Pelican delivery on a synthwave beach boardwalk</title>
  <desc id="art-description">
    A white pelican walks along a wooden boardwalk while carrying a colorful
    blanket, a metal rack, a teal bicycle, a second pelican, a yellow bicycle,
    and a white game controller. A lighthouse, sailboat, kite, setting sun,
    crescent moon, stars, clouds, and reflective sea fill the sunset background.
  </desc>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const travelStack = $("travel-stack");
  const leftLeg = $("lower-left-leg");
  const rightLeg = $("lower-right-leg");
  const upperHead = $("upper-head");
  const fish = $("fish-wiggle");
  const beam = $("beam-rotate");
  const bottomChain = $("bottom-chain");
  const topChain = $("top-chain");
  const bottomCrank = $("bottom-crank");
  const topCrank = $("top-crank");

  const wheels = [
    { element: $("bottom-rear-wheel"),  cx: 630, cy: 475, speed: 142 },
    { element: $("bottom-front-wheel"), cx: 870, cy: 475, speed: 142 },
    { element: $("top-rear-wheel"),    cx: 550, cy: 262, speed: 190 },
    { element: $("top-front-wheel"),   cx: 755, cy: 262, speed: 190 }
  ];

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function rotateAbout(element, cx, cy, degrees) {
    element.setAttribute("transform", `rotate(${degrees} ${cx} ${cy})`);
  }

  function render(timeSeconds) {
    const t = timeSeconds;

    const walk = Math.sin(t * 2.15);
    const bob = Math.sin(t * 2.15) * 3.4;
    const sway = Math.sin(t * 1.075) * 0.48;
    const drift = Math.sin(t * 1.075) * 1.4;

    travelStack.setAttribute(
      "transform",
      `translate(${drift} ${bob}) rotate(${sway} 610 760)`
    );

    rotateAbout(leftLeg, 478, 765, walk * 7.5);
    rotateAbout(rightLeg, 551, 770, -walk * 7.5);

    const headBob = Math.sin(t * 2.15 + 0.35);
    upperHead.setAttribute(
      "transform",
      `translate(0 ${headBob * 1.8}) rotate(${headBob * 2.5} 832 326)`
    );

    rotateAbout(fish, 974, 317, Math.sin(t * 5.2) * 7);

    wheels.forEach(wheel => {
      rotateAbout(wheel.element, wheel.cx, wheel.cy, t * wheel.speed);
    });

    rotateAbout(bottomCrank, 748, 475, -t * 155);
    rotateAbout(topCrank, 653, 262, -t * 205);

    bottomChain.style.strokeDashoffset = String(-t * 29);
    topChain.style.strokeDashoffset = String(-t * 36);

    beam.setAttribute("transform", `rotate(${Math.sin(t * 0.38) * 9})`);
  }

  if (reducedMotion) {
    render(0);
    return;
  }

  const start = performance.now();

  function frame(now) {
    render((now - start) / 1000);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
